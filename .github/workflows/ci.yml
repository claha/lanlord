name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: fmt
            command: cargo fmt --check
          - check: clippy
            command: cargo clippy --all-targets -- -D warnings
          - check: test
            command: cargo test
          - check: build
            command: nix build
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Restore cargo artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.check }}-${{ hashFiles('flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.check }}-

      - name: ${{ matrix.check }}
        run: nix develop --command bash -c '${{ matrix.command }}'
