[package]
name = "lanlord"
version = "0.1.0"
edition = "2024"
description = "Self-hosted LAN device inventory for homelabs"
license = "MIT"
repository = "https://github.com/claha/lanlord"

[dependencies]
axum = "0.8"
http = "1"
http-body = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
maud = "0.26"
rusqlite = "0.33"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
toml = "0.8"
tower = "0.5"

[dev-dependencies]
rusqlite = "0.33"
